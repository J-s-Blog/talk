// 包装为完整 HTML 文档（htmlDocx.asBlob / 打印窗口共用）
function wrapDocHtml(title, inner) {
    return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>${escapeHtml(title)}</title><style>${NEWS_EXPORT_CSS}</style></head><body>${inner}</body></html>`;
}

// 组装单篇文章的导出 HTML（分类 + 标题 + 作者/时间 + 富文本正文）
function buildArticleExportHtml(d, opts = {}) {
    const cat = [d.parentPlateName, d.plateName].filter(Boolean).join(' > ');
    const body = opts.bodyHtml != null ? opts.bodyHtml : sanitizeArticleHtml(d.content || '');
    return `
    <div class="news-article">
        ${cat ? `<div class="news-cat">${escapeHtml(cat)}</div>` : ''}
        <h1>${escapeHtml(d.title || '无标题')}</h1>
        <div class="article-meta">作者：${escapeHtml(d.postUserName || '-')} ｜ 发布时间：${escapeHtml(d.releaseTime || '-')}</div>
        <div class="article-body">${body || '<p>（无内容）</p>'}</div>
    </div>`;
}

// 文件名清洗：去除非法字符、截断长度
function sanitizeFilename(name) {
    return String(name || '未命名')
        .replace(/[\\/:*?"<>|\r\n\t]/g, '')
        .replace(/^\.+|\.+$/g, '')
        .trim()
        .slice(0, 60) || '未命名';
}

// Blob 触发浏览器下载
function saveBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
}

// 图片内嵌：将正文中的远程图片转为 base64 dataURL（Word 打开时无需联网）；
// 失败保留原链接，多图间小睡限流。同时补全协议相对/相对路径。
// Word 不识别 max-width CSS，需按原始尺寸计算显式像素宽度（超出正文可用宽度则等比缩小），
// 否则宽图会溢出页面边界被裁切。
const NEWS_IMG_MAX_WIDTH = 600; // A4 正文可用宽度（默认页边距下约 6.25 英寸 ≈ 600px）

// 测量图片原始尺寸（3 秒超时兜底，失败返回 0）
function measureImageSize(src) {
    return new Promise(resolve => {
        const img = new Image();
        const timer = setTimeout(() => resolve({ w: 0, h: 0 }), 3000);
        img.onload = () => { clearTimeout(timer); resolve({ w: img.naturalWidth || 0, h: img.naturalHeight || 0 }); };
        img.onerror = () => { clearTimeout(timer); resolve({ w: 0, h: 0 }); };
        img.src = src;
    });
}

async function inlineArticleImages(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const imgs = Array.from(tmp.querySelectorAll('img'));
    const toFetch = [];
    imgs.forEach(img => {
        let src = img.getAttribute('src') || '';
        if (!src || src.startsWith('data:')) return;
        if (src.startsWith('//')) src = 'https:' + src;
        else if (/^\/(?!\/)/.test(src)) src = ORIGIN + src;
        if (/^https?:/i.test(src)) toFetch.push([img, src]);
        else { img.removeAttribute('loading'); img.setAttribute('src', src); }
    });
    const cache = new Map();
    for (const [, src] of [...new Map(toFetch.map(([img, s]) => [s, img]))]) {
        try {
            const resp = await fetch(src, { credentials: 'include' });
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            const blob = await resp.blob();
            const dataUrl = await new Promise((resolve, reject) => {
                const fr = new FileReader();
                fr.onload = () => resolve(fr.result);
                fr.onerror = reject;
                fr.readAsDataURL(blob);
            });
            cache.set(src, dataUrl);
        } catch (e) {
            console.warn('图片内嵌失败（保留原链接）:', src, e);
        }
        await sleep(80);
    }
    // 回写 src + 宽度约束：测量原始尺寸，超宽图片写显式像素宽度（Word 按宽度等比缩放）
    for (const img of imgs) {
        img.removeAttribute('loading');
        img.removeAttribute('srcset');
        const declaredW = parseInt(img.getAttribute('width'), 10)
            || parseInt(img.style.width, 10) || 0;
        // 清掉 CSS 约束，改用显式宽度（Word 不识别 max-width）
        img.style.maxWidth = '';
        if (cache.size) {
            let src = img.getAttribute('src') || '';
            if (src.startsWith('//')) src = 'https:' + src;
            else if (/^\/(?!\/)/.test(src)) src = ORIGIN + src;
            if (cache.has(src)) img.setAttribute('src', cache.get(src));
            else if (/^https?:/i.test(src)) img.setAttribute('src', src);
        }
        const { w: naturalW } = await measureImageSize(img.getAttribute('src'));
        let dispW = declaredW || naturalW || 0;
        if (naturalW > 0) dispW = Math.min(dispW, naturalW); // 不放大小图
        if (dispW > NEWS_IMG_MAX_WIDTH) {
            img.setAttribute('width', NEWS_IMG_MAX_WIDTH);
            img.style.width = NEWS_IMG_MAX_WIDTH + 'px';
            img.style.height = 'auto'; // Word 按宽度等比缩放高度
        }
    }
    return tmp.innerHTML;
}

// 导出期间禁用所有下载按钮
function setNewsExportButtonsDisabled(disabled) {

}

// 单篇下载 Word：详情（缓存优先）→ 图片内嵌 → htmlDocx.asBlob → 保存
async function downloadNewsWordById(postId) {
    if (newsExportBusy) return;
    newsExportBusy = true;
    setNewsExportButtonsDisabled(true);
    try {
        updateBrowseStatus('正在生成 Word（图片内嵌中）...', 'checking');
        let detail = newsDetailCache[postId];
        if (!detail) detail = await fetchNewsDetail(postId);
        const bodyHtml = await inlineArticleImages(sanitizeArticleHtml(detail.content || ''));
        const inner = buildArticleExportHtml(detail, { bodyHtml });
        const blob = htmlDocx.asBlob(wrapDocHtml(detail.title || '热点资讯', inner));
        saveBlob(blob, `热点资讯_${sanitizeFilename(detail.title)}.docx`);
        updateBrowseStatus('✅ Word 已生成');
        showToast('✅ Word 已生成', 'success');
    } catch (e) {
        console.warn(e);
        updateBrowseStatus(`❌ Word 生成失败: ${e.message}`, 'error');
        showToast(`❌ Word 生成失败: ${e.message}`, 'error');
    } finally {
        newsExportBusy = false;
        setNewsExportButtonsDisabled(false);
    }
}

// 隐藏 iframe 打印窗口：写入样式化 HTML 后唤起打印（用户选择「另存为 PDF」）
function printHtmlInIframe(html) {
    let frame = document.getElementById('newsPrintFrame');
    if (!frame) {
        frame = document.createElement('iframe');
        frame.id = 'newsPrintFrame';
        frame.style.cssText = 'position:fixed;right:0;bottom:0;width:1px;height:1px;border:0;visibility:hidden;';
        document.body.appendChild(frame);
    }
    // 追加唯一注释，确保相同内容也能触发重新加载与 onload
    frame.srcdoc = html + `<!--print-${Date.now()}-->`;
    frame.onload = () => {
        try {
            frame.contentWindow.focus();
            frame.contentWindow.print();
        } catch (e) {
            console.warn('唤起打印失败:', e);
            showToast('❌ 唤起打印失败，请重试', 'error');
        }
    };
}

// 单篇导出 PDF：打印导出（零依赖，中文/图片/排版完美还原）

// 批量下载所选文章：mode='merged' 合并成一个 Word（带目录分页）/ mode='zip' 每篇一个 docx 打包
async function downloadSelectedNews(mode) {
    if (newsExportBusy || newsSelectedIds.size === 0) return;
    closePackModal();
    newsExportBusy = true;
    setNewsExportButtonsDisabled(true);
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    progressBar.style.display = 'block';
    progressText.style.display = 'block';

    try {
        const total = newsSelectedIds.size;
        // 按当前列表顺序整理选中项；其他页/旧数据中选中的 postId 追加在后（详情按 postId 抓取即可）
        const ordered = newsData.filter(d => newsSelectedIds.has(String(d.postId)))
            .map(d => ({ postId: d.postId, title: d.title }));
        const extra = [...newsSelectedIds]
            .filter(pid => !ordered.some(t => String(t.postId) === pid))
            .map(pid => ({ postId: pid, title: '' }));
        const tasks = [...ordered, ...extra];

        // 逐篇获取详情 + 图片内嵌（缓存命中跳过请求；未命中时限流抖动，≤3 次/秒）
        const docs = [];   // { title, inner }
        const failed = [];
        for (let i = 0; i < tasks.length; i++) {
            const t = tasks[i];
            const pct = Math.round((i / total) * 100);
            progressFill.style.width = pct + '%';
            progressText.textContent = `正在获取文章内容: ${i + 1}/${total}（${pct}%）- ${t.title || t.postId}`;
            try {
                let detail = newsDetailCache[t.postId];
                if (!detail) {
                    detail = await fetchNewsDetail(t.postId);
                    newsDetailCache[t.postId] = detail;
                    await sleep(300 + Math.random() * 300);
                }
                const bodyHtml = await inlineArticleImages(sanitizeArticleHtml(detail.content || ''));
                docs.push({ title: detail.title || t.title || String(t.postId), inner: buildArticleExportHtml(detail, { bodyHtml }) });
            } catch (e) {
                console.warn('文章获取失败，跳过:', t.postId, e);
                failed.push(t.title || String(t.postId));
            }
        }
        if (docs.length === 0) throw new Error('没有可导出的文章（全部获取失败）');

        const dateStr = new Date().toISOString().slice(0, 10);
        progressFill.style.width = '92%';
        if (mode === 'zip') {
            progressText.textContent = `正在打包 zip（${docs.length} 篇）...`;
            const zip = new JSZip();
            const used = new Set();
            docs.forEach((doc, i) => {
                const base = `${String(i + 1).padStart(2, '0')}_${sanitizeFilename(doc.title)}`;
                let name = base, n = 2;
                while (used.has(name)) name = `${base}(${n++})`;
                used.add(name);
                zip.file(`${name}.docx`, htmlDocx.asBlob(wrapDocHtml(doc.title, doc.inner)));
            });
            const blob = await zip.generateAsync({ type: 'blob' });
            progressFill.style.width = '100%';
            saveBlob(blob, `热点资讯_${docs.length}篇_${dateStr}.zip`);
        } else {
            progressText.textContent = `正在合并 Word（${docs.length} 篇）...`;
            // 目录页 + 每篇之间插入 Word 分页符
            let inner = `<div class="news-toc"><h1>目录</h1><ol>${docs.map(doc => `<li>${escapeHtml(doc.title)}</li>`).join('')}</ol></div>`;
            docs.forEach(doc => {
                inner += `<br clear="all" style="mso-special-character:line-break;page-break-before:always">` + doc.inner;
            });
            const blob = htmlDocx.asBlob(wrapDocHtml(`热点资讯合集_${docs.length}篇`, inner));
            progressFill.style.width = '100%';
            saveBlob(blob, `热点资讯合集_${docs.length}篇_${dateStr}.docx`);
        }

        progressText.textContent = failed.length
            ? `⚠️ 导出完成：成功 ${docs.length} 篇，失败 ${failed.length} 篇（${failed.slice(0, 3).join('、')}${failed.length > 3 ? ' 等' : ''}）`
            : `✅ 导出完成！共 ${docs.length} 篇文章`;
        showToast(failed.length
            ? `⚠️ 导出完成：${docs.length} 篇成功，${failed.length} 篇失败`
            : `✅ 导出完成！共 ${docs.length} 篇文章`, 'success');
        updateBrowseStatus(`✅ ${progressText.textContent}`);
    } catch (err) {
        console.warn(err);
        progressText.textContent = `❌ 导出失败: ${err.message}`;
        showToast(`❌ 导出失败: ${err.message}`, 'error');
        updateBrowseStatus(`❌ 导出失败: ${err.message}`, 'error');
    } finally {
        newsExportBusy = false;
        setNewsExportButtonsDisabled(false);
        setTimeout(() => {
            progressBar.style.display = 'none';
            progressText.style.display = 'none';
            progressFill.style.width = '0%';
        }, 4000);
    }
}

// 获取人员阅读量排名（近30天，rankingType=1）
async function fetchRanking() {
    const end = new Date();
    const start = new Date(end.getTime() - 30 * 24 * 60 * 60 * 1000);
    const buildUrl = () => `${FORUM_RANK_PATH}?startDate=${formatDate(start)}&endDate=${formatDate(end)}&rankingType=1&token=${authToken}&companyId=${COMPANY_ID}`;
    let data = await apiGet(buildUrl());
    if (isAuthExpired(data)) {
        clearToken();
        await ensureLogin(true);
        data = await apiGet(buildUrl());
    }
    if (!data || data.resultCode !== 0 || !data.resultData) {
        throw new Error(data?.resultMessage || '获取阅读量排名失败');
    }
    rankData = data.resultData;
    renderRankChip();
}

// 状态栏排名徽章：仅资讯视图且有排名数据时显示「阅读N · 第M名」，点击弹窗看前十

        const medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
        body.innerHTML = `
            ${mine ? `<div class="rank-mine">我（${escapeHtml(mine.userName || '-')}）：阅读 <b>${mine.count ?? '-'}</b> 篇 · 当前排名 <b>第 ${mine.ranking ?? '-'}</b> 名</div>` : ''}
            <table class="rank-table">
                <tr><th>排名</th><th>姓名</th><th>阅读量</th></tr>
                ${list.map(u => `
                    <tr class="${u.ranking <= 3 ? 'top' + u.ranking : ''}">
                        <td class="rk">${medals[u.ranking] || u.ranking}</td>
                        <td>${escapeHtml(u.userName || '-')}</td>
                        <td>${u.count ?? '-'}</td>
                    </tr>`).join('')}
            </table>`;
    }
    document.getElementById('rankModalMask').classList.add('show');
}

function closeRankModal() {
    document.getElementById('rankModalMask').classList.remove('show');
}

// 富文本清洗：保留排版标签与内联样式（字体粗细/大小、缩进、表格、图片等），
// 移除脚本/事件属性，避免直接注入风险；图片强制自适应宽度。
function sanitizeArticleHtml(html) {
    const tmp = document.createElement('div');
    tmp.innerHTML = String(html);
    tmp.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n => n.remove());
    tmp.querySelectorAll('*').forEach(el => {
        Array.from(el.attributes).forEach(attr => {
            const name = attr.name.toLowerCase();
            if (name.startsWith('on')) el.removeAttribute(attr.name);
            if ((name === 'href' || name === 'src') && /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
        });
    });
    tmp.querySelectorAll('img').forEach(img => {
        img.removeAttribute('width'); img.removeAttribute('height');
        img.style.maxWidth = '100%'; img.style.height = 'auto';
        img.loading = 'lazy';
    });
    return tmp.innerHTML;
}

// 浏览器（Chrome/Edge）对已保存凭据的自动填充会用内置大字号渲染账号/密码框，
// 直到该区域重绘后才按页面 CSS 字号显示（表现为首次加载字号偏大，切换视图后恢复）。
// 加载后检测到已填充值时，主动对账号密码区做一次隐藏/显示强制重绘拉齐字号。
(function normalizeCredAutofillRender() {
    const fix = () => {
        const phone = document.getElementById('phoneInput');
        const pwd = document.getElementById('pwdInput');
        if (!phone || !pwd) return;
        if (!phone.value && !pwd.value) return; // 无自动填充则无需处理
        const wrap = phone.closest('.cred-group');
        if (!wrap) return;
        wrap.style.display = 'none';
        void wrap.offsetHeight; // 强制重排
        wrap.style.display = '';
    };
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => setTimeout(fix, 100));
    } else {
        setTimeout(fix, 100);
    }
})();

// 自动运行：URL 带 ?taskName=autorun 时自动执行导出（使用预填账号与自动计算的日期范围）
(function autoRunIfParam() {
    const params = new URLSearchParams(window.location.search);
    if (params.get('taskName') === 'autorun') {
        // 等待 DOM 和日期初始化完成后再执行
        setTimeout(() => runExport(), 500);
    }
})();
</script>
