<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>大学堂周报自动抓取工具</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js@0.3.1/dist/html-docx.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 30px 15px;
        }
        .container {
            background: rgba(255,255,255,0.97);
            border-radius: 20px;
            box-shadow: 0 25px 80px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 760px;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #0f3460 0%, #533483 100%);
            color: #fff;
            padding: 28px 30px;
            text-align: center;
        }
        .header h1 { font-size: 22px; margin-bottom: 6px; letter-spacing: 1px; }
        .header p { font-size: 12px; opacity: 0.75; }
        .body { padding: 28px; }
        label { display: block; font-size: 12px; color: #666; margin-bottom: 3px; }
        input[type="text"], input[type="search"], input[type="date"], input[type="password"], textarea, select {
            width: 100%;
            padding: 9px 12px;
            border: 1.5px solid #e0e0e0;
            border-radius: 8px;
            font-size: 13px;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: #fafafa;
        }
        input:focus, textarea:focus, select:focus {
            border-color: #533483;
            box-shadow: 0 0 0 3px rgba(83,52,131,0.1);
            background: #fff;
        }
        textarea { resize: vertical; min-height: 70px; font-family: "Consolas", monospace; font-size: 11px; }
        .btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }
        .btn:active { transform: scale(0.98); }
        .btn-primary {
            background: linear-gradient(135deg, #0f3460 0%, #533483 100%);
            color: #fff;
        }
        .btn-primary:hover { box-shadow: 0 6px 24px rgba(83,52,131,0.4); transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }
        .btn-success:hover { box-shadow: 0 6px 24px rgba(17,153,142,0.4); transform: translateY(-1px); }
        .progress-bar {
            width: 100%; height: 6px;
            background: #e8e8e8;
            border-radius: 3px;
            overflow: hidden;
            margin: 0 0 8px;
            display: none;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #0f3460, #533483);
            border-radius: 3px;
            transition: width 0.3s;
            width: 0%;
        }
        .status-bar {
            background: #f0f0f0; border-radius: 6px; padding: 5px 12px;
            font-size: 10.5px; color: #666;
            display: flex; align-items: center; gap: 8px;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #ccc;
            display: inline-block;
        }
        .status-dot.online { background: #4caf50; }
        .status-dot.offline { background: #f44336; }
        .status-dot.checking { background: #ff9800; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }

        /* ===== 顶栏：加载周报/导出周报 + 登录认证 + 时间范围 + 状态信息（合并） ===== */
        .top-line { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        /* 状态栏设最小宽度：空间不足时整体换行，避免文字被挤成竖条 */
        .top-line .status-bar { flex: 1 1 260px; min-width: 260px; margin-bottom: 0; }
        .top-line .cred-group { display: flex; gap: 8px; flex: 0 0 auto; }
        .top-line .date-range { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }
        .top-line .cred-input { flex: 0 0 150px; width: 150px; padding: 6px 10px; font-size: 12px; }
        .top-line .date-input { flex: 0 0 135px; width: 135px; padding: 5px 8px; font-size: 12px; }
        /* 报告类型下拉（周报/日报/全部）：与日期输入同高 */
        .top-line .date-range select { flex: none; width: auto; padding: 5px 8px; font-size: 12px; cursor: pointer; }
        .top-line #tabBtnExport { border-color: #b7dfb9; background: #f2faf2; color: #2e7d32; }
        .top-line #tabBtnExport:hover { border-color: #2e7d32; }
        #statusBar #redownloadBtn { margin-left: auto; flex-shrink: 0; }
        .date-sep { flex: none; color: #999; font-size: 12px; }
        .tab-nav { display: flex; gap: 6px; flex-shrink: 0; }
        .tab-nav button {
            flex: none; padding: 6px 14px; border: 2px solid #e0e0e0;
            border-radius: 10px; background: #fafafa; cursor: pointer;
            font-size: 12px; font-weight: bold; color: #666; transition: all 0.2s;
        }
        .tab-nav button.active { border-color: #533483; background: #ede7f6; color: #533483; }
        .tab-nav button:hover { border-color: #533483; }
        .tab-nav button:disabled { opacity: 0.55; cursor: not-allowed; }
        /* 视图切换按钮（周报/热点资讯）用蓝色系，与操作按钮区分 */
        .tab-nav .view-btn { border-color: #c5cae9; background: #f5f7ff; color: #3949ab; }
        .tab-nav .view-btn.active { border-color: #3949ab; background: #3949ab; color: #fff; }
        .nav-sep { width: 1px; align-self: stretch; background: #e0e0e0; margin: 2px 4px; flex: none; }
        /* 加载分页下拉框（每页100 / 全部） */
        .tab-nav select { width: auto; flex: none; padding: 6px 8px; font-size: 12px; cursor: pointer; border: 2px solid #e0e0e0; border-radius: 10px; }
        /* 资讯列表底部分页控件 */
        .pager { display: flex; align-items: center; gap: 6px; flex: none; padding-top: 2px; }
        .pager-btn {
            width: auto; margin-top: 0; padding: 6px 10px; font-size: 11.5px; flex: 1 1 auto;
            border: 1.5px solid #d5c8e8; border-radius: 8px; background: #faf7fd; color: #533483;
            cursor: pointer; transition: all 0.15s; white-space: nowrap;
        }
        .pager-btn:hover:not(:disabled) { background: #ede7f6; border-color: #533483; }
        .pager-btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .pager-info { flex: none; font-size: 11.5px; color: #666; white-space: nowrap; }
        .container.wide { max-width: 1080px; }
        /* 视图面板：在浏览模式下撑满剩余高度 */
        .view-pane { display: flex; flex-direction: column; min-height: 0; }
        .view-pane > .browse-wrap { flex: 1 1 0; min-height: 0; }

        /* ===== 在线浏览 ===== */
        .btn-sm { width: auto; padding: 8px 14px; font-size: 12px; margin-top: 0; }
        .btn-xs { width: auto; margin-top: 0; padding: 5px 12px; font-size: 11px; flex-shrink: 0; }
        .browse-status { font-size: 11px; color: #888; margin-bottom: 0; min-width: 0; }
        /* 轻量提示气泡（登录成功/失败等） */
        .toast {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
            background: #323232; color: #fff; padding: 10px 18px; border-radius: 8px;
            font-size: 13px; z-index: 9999; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
            opacity: 0; transition: opacity 0.3s; pointer-events: none; max-width: 80%;
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #2e7d32; }
        .toast.error { background: #c62828; }
        .browse-wrap { display: flex; gap: 14px; align-items: stretch; }
        /* 左侧栏：加载按钮 / 搜索框 / 部门下拉 / 名单列表 纵向排列 */
        .list-side {
            width: 250px; flex-shrink: 0; min-height: 0;
            display: flex; flex-direction: column; gap: 8px;
        }
        .list-side .btn-sm { width: 100%; }
        .list-side select { width: 100%; cursor: pointer; padding: 7px 10px; }
        /* 搜索框(1/3) + 部门下拉(2/3) 并排一行 */
        .filter-row { display: flex; gap: 6px; }
        .filter-row input { flex: 1 1 33%; min-width: 0; padding: 7px 10px; }
        .filter-row select { flex: 1 1 67%; min-width: 0; }
        /* 热点资讯筛选行：搜索框占主宽度（带清除叉叉），筛选下拉仅显示两个字 */
        .filter-row.news-filter-row input { flex: 1 1 auto; }
        .filter-row.news-filter-row input::-webkit-search-cancel-button { cursor: pointer; }
        .filter-row.news-filter-row select { flex: 0 0 64px; width: 64px; padding: 7px 4px; font-size: 12px; }
        /* 周报筛选行：搜索框带清除叉叉，部门下拉固定窄宽（展开时选项列表自动加宽） */
        .filter-row.week-filter-row select { flex: 0 0 140px; width: 140px; padding: 7px 6px; font-size: 12px; }
        .person-list {
            flex: 1 1 0; min-height: 0; width: 100%; overflow-y: auto;
            display: flex; flex-direction: column; gap: 8px; padding-right: 2px;
            /* 底部留出空间，避免最后一条内容被浏览器底栏/任务栏遮挡 */
            padding-bottom: 110px;
        }
        .person-list::-webkit-scrollbar { width: 5px; }
        .person-list::-webkit-scrollbar-thumb { background: #d5c8e8; border-radius: 3px; }
        .person-card {
            border: 1.5px solid #e0e0e0; border-radius: 10px; background: #fafafa;
            padding: 10px 12px; cursor: pointer; transition: all 0.15s;
        }
        .person-card:hover { border-color: #533483; background: #f6f1fb; }
        .person-card.active { border-color: #533483; background: #ede7f6; }
        .person-card .p-name { font-weight: bold; font-size: 14px; color: #333; }
        .person-card .p-meta { font-size: 11px; color: #888; margin-top: 3px; line-height: 1.6; }
        .detail-panel {
            flex: 1; min-width: 0; overflow-y: auto;
            background: #fff; border: 1px solid #eee; border-radius: 12px;
            padding: 14px 16px; padding-bottom: 110px; box-shadow: 0 2px 10px rgba(83,52,131,0.06);
        }
        .detail-panel::-webkit-scrollbar { width: 6px; }
        .detail-panel::-webkit-scrollbar-thumb { background: #d5c8e8; border-radius: 3px; }
        .detail-panel:has(> .empty-tip) { display: flex; align-items: center; justify-content: center; }
        /* 发贴统计表格 */
        .stats-head { font-weight: bold; font-size: 13.5px; color: #333; }
        .stats-tip {
            font-weight: normal; font-size: 12px; color: #b26a00; background: #fff7e6;
            border: 1px solid #ffd591; border-radius: 6px; padding: 6px 10px; margin-top: 6px; line-height: 1.6;
        }
        .stats-table { width: auto; max-width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 10px; }
        .stats-table th, .stats-table td { border: 1px solid #e0e0e0; padding: 6px 12px; text-align: left; white-space: nowrap; }
        .stats-table th { background: #f5f7ff; color: #3949ab; text-align: center; }
        .stats-table tbody tr:nth-child(even) { background: #fafafa; }
        .stats-table td.num { text-align: center; font-variant-numeric: tabular-nums; }
        .stats-table td.time { text-align: center; }
        .btn-back {
            display: none; background: #eee; color: #555; border: none;
            border-radius: 8px; padding: 8px 14px; font-size: 12px;
            cursor: pointer; margin-bottom: 10px;
            position: sticky; top: 0; z-index: 5;
            margin-left: auto; /* 手机端靠右显示，方便右手单手点击 */
        }
        .detail-header { border-bottom: 2px solid #ede7f6; padding-bottom: 10px; margin-bottom: 12px; }
        .detail-header h3 { color: #533483; font-size: 18px; }
        .detail-header .d-meta { font-size: 12px; color: #777; margin-top: 4px; line-height: 1.7; }
        .detail-section { margin-bottom: 14px; }
        .detail-section h4 {
            font-size: 13px; color: #533483; margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .detail-section h4::before {
            content: ""; display: inline-block;
            width: 4px; height: 12px; background: #533483; border-radius: 2px;
        }
        .detail-section .content {
            background: #fafafa; border: 1px solid #eee; border-radius: 8px;
            padding: 10px 12px; font-size: 13px; color: #444; line-height: 1.9;
            white-space: pre-wrap; word-break: break-word;
        }
        .inline-img-wrap { margin: 8px 0; }
        .inline-img {
            max-width: 100%; height: auto; border-radius: 8px;
            border: 1px solid #e0e0e0; cursor: pointer; display: block;
        }
        .indicator-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .indicator-table th, .indicator-table td {
            border: 1px solid #e0e0e0; padding: 6px 8px; text-align: left;
        }
        .indicator-table th { background: #ede7f6; color: #533483; }
        .indicator-remark td {
            background: #fffde7; color: #8d6e00; font-size: 11px;
            white-space: pre-wrap; word-break: break-word;
        }

        /* 周报正文中的表格还原 */
        .detail-table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 8px 0; background: #fff; }
        .detail-table th, .detail-table td {
            border: 1px solid #d8d2e8; padding: 6px 8px;
            white-space: pre-wrap; word-break: break-word;
        }
        .detail-table th { background: #ede7f6; color: #533483; font-weight: bold; text-align: center; }
        .detail-table td { text-align: left; }
        .detail-table tr:nth-child(even) td { background: #fafafa; }
        .table-scroll { overflow-x: auto; }
        .content + .table-scroll, .table-scroll + .content { margin-top: 8px; }
        .table-scroll + .table-scroll { margin-top: 8px; }
        .empty-tip { text-align: center; color: #aaa; font-size: 13px; padding: 20px 0; }

        /* ===== 热点资讯：文章卡片与富文本正文 ===== */
        .person-card .p-title { font-weight: bold; font-size: 13.5px; color: #333; line-height: 1.5; }
        .person-card .p-top { display: inline-block; font-size: 10px; color: #fff; background: #e53935; border-radius: 4px; padding: 0 5px; margin-right: 5px; vertical-align: 2px; }
        .news-cat { font-size: 11px; color: #533483; background: #ede7f6; border-radius: 4px; padding: 1px 7px; display: inline-block; margin-bottom: 6px; }
        /* 富文本正文：还原文章原始格式（字体粗细、大小、表格、图片、列表等） */
        .article-body { font-size: 15px; line-height: 1.9; color: #333; word-break: break-word; }
        .article-body p { margin: 0 0 12px; }
        .article-body h1, .article-body h2, .article-body h3, .article-body h4 { margin: 18px 0 10px; line-height: 1.5; color: #222; }
        .article-body h2 { font-size: 20px; border-left: 4px solid #533483; padding-left: 10px; }
        .article-body h3 { font-size: 17px; }
        .article-body ol, .article-body ul { margin: 0 0 12px; padding-left: 26px; }
        .article-body li { margin: 4px 0; }
        .article-body img { max-width: 100%; height: auto; border-radius: 8px; margin: 8px 0; display: block; }
        .article-body table { width: 100%; border-collapse: collapse; margin: 12px 0; font-size: 13px; }
        .article-body th, .article-body td { border: 1px solid #d8d2e8; padding: 7px 9px; vertical-align: top; }
        .article-body th { background: #ede7f6; color: #533483; font-weight: bold; }
        .article-body blockquote { border-left: 4px solid #d5c8e8; background: #faf7fd; margin: 12px 0; padding: 8px 14px; color: #666; }
        .article-body a { color: #3949ab; text-decoration: underline; }
        .article-body .ql-ui { display: none; } /* 隐藏 quill 编辑器占位符 */
        .article-body .ql-indent-1 { padding-left: 2em; }
        .article-body .ql-indent-2 { padding-left: 4em; }
        .article-body .ql-indent-3 { padding-left: 6em; }
        .article-body .ql-align-center { text-align: center; }
        .article-body .ql-align-right { text-align: right; }
        .article-body .ql-align-justify { text-align: justify; }
        .article-meta { font-size: 12.5px; color: #777; margin-top: 6px; line-height: 1.8; }
        .article-meta .am-stat { color: #999; margin-left: 10px; }
        /* 文章末尾「已学习」名单 */
        .learn-section {
            margin-top: 22px; border-top: 2px solid #ede7f6; padding-top: 12px;
        }
        .learn-section h4 {
            font-size: 14px; color: #533483; margin-bottom: 6px;
            display: flex; align-items: center; gap: 6px;
        }
        .learn-names {
            background: #fafafa; border: 1px solid #eee; border-radius: 8px;
            padding: 10px 12px; font-size: 13px; color: #444; line-height: 1.9;
            word-break: break-all;
        }

        /* ===== 热点资讯：批量选择与打包下载 ===== */
        .news-bulk-bar {
            display: none; flex-wrap: wrap; align-items: center; gap: 6px;
            background: #f6f1fb; border: 1px solid #d5c8e8; border-radius: 8px;
            padding: 6px 10px; font-size: 12px;
        }
        .news-bulk-bar.show { display: flex; }
        .news-bulk-bar .bulk-count { font-weight: bold; color: #533483; white-space: nowrap; }
        .news-bulk-bar button { width: auto; flex-shrink: 0; margin-top: 0; padding: 4px 10px; font-size: 11px; white-space: nowrap; }
        /* 文章卡片复选框：左侧垂直居中，正文右移避让 */
        #newsList .person-card { position: relative; padding-left: 32px; }
        .news-check {
            position: absolute; left: 10px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; cursor: pointer;
        }
        .news-check input { width: 16px; height: 16px; cursor: pointer; accent-color: #533483; margin: 0; }
        .person-card.checked { border-color: #2e7d32; background: #f2faf2; }
        /* 详情面板下载按钮组 */
        .detail-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        /* 打包方式选择弹窗（复用 rank-modal 遮罩与容器） */
        .pack-options { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 10px; }
        .pack-option-btn {
            border: 1.5px solid #d5c8e8; background: #faf7fd; border-radius: 10px;
            padding: 12px 14px; font-size: 14px; font-weight: bold; color: #533483;
            cursor: pointer; text-align: left; line-height: 1.6; transition: all 0.15s;
        }
        .pack-option-btn:hover { border-color: #533483; background: #ede7f6; }
        .pack-option-btn span { display: block; font-size: 11.5px; font-weight: normal; color: #888; margin-top: 2px; }
        .pack-tip { font-size: 11.5px; color: #999; text-align: center; }

        /* ===== 阅读量排名：状态栏徽章 + 前十弹窗 ===== */
        .rank-chip {
            flex: none; font-size: 11.5px; color: #533483; background: #ede7f6;
            border: 1px solid #d5c8e8; border-radius: 20px; padding: 2px 10px;
            cursor: pointer; white-space: nowrap; transition: all 0.15s;
        }
        .rank-chip:hover { background: #dcd3ee; border-color: #533483; }
        .rank-chip b { font-weight: bold; }
        .rank-modal-mask {
            position: fixed; inset: 0; background: rgba(0,0,0,0.45);
            display: none; align-items: center; justify-content: center; z-index: 9998;
            padding: 16px;
        }
        .rank-modal-mask.show { display: flex; }
        .rank-modal {
            background: #fff; border-radius: 14px; width: 100%; max-width: 460px;
            max-height: 80vh; display: flex; flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.35); overflow: hidden;
        }
        .rank-modal-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px; background: linear-gradient(135deg, #0f3460 0%, #533483 100%); color: #fff;
        }
        .rank-modal-head h3 { font-size: 15px; }
        .rank-modal-close {
            background: rgba(255,255,255,0.15); border: none; color: #fff;
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 13px;
        }
        .rank-modal-close:hover { background: rgba(255,255,255,0.3); }
        .rank-modal-body { overflow-y: auto; padding: 12px 16px; }
        .rank-mine {
            background: #f2faf2; border: 1px solid #b7dfb9; border-radius: 8px;
            padding: 8px 12px; font-size: 13px; color: #2e7d32; margin-bottom: 10px;
        }
        .rank-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .rank-table th, .rank-table td { padding: 7px 8px; border-bottom: 1px solid #eee; text-align: left; }
        .rank-table th { background: #ede7f6; color: #533483; }
        .rank-table td.rk { width: 44px; text-align: center; font-weight: bold; color: #533483; }
        .rank-table td.rk .medal { font-size: 15px; }
        .rank-table tr.top1 td, .rank-table tr.top2 td, .rank-table tr.top3 td { background: #fdf9ef; }

        /* 浏览模式（默认视图）：铺满全屏、页面锁定不滚动，人员列表与周报详情各自内部滚动 */
        body.browse-mode { overflow: hidden; height: 100vh; height: 100dvh; padding: 0; }
        body.browse-mode .container { width: 100%; max-width: none; height: 100%; display: flex; flex-direction: column; border-radius: 0; }
        body.browse-mode .header { flex-shrink: 0; padding: 12px 18px; }
        body.browse-mode .header p { display: none; }
        body.browse-mode .body { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; padding: 12px 16px 14px; }
        body.browse-mode .top-line,
        body.browse-mode #progressBar, body.browse-mode #progressText { flex-shrink: 0; }
        body.browse-mode .view-pane { flex: 1 1 0; min-height: 0; }
        body.browse-mode .browse-wrap { flex: 1 1 0; min-height: 0; }

        /* ===== 小屏适配（手机 / 平板） ===== */
        @media (max-width: 720px) {
            body { padding: 12px 8px; }
            .header { padding: 18px 14px; }
            .header h1 { font-size: 17px; }
            .header p { font-size: 10px; }
            .body { padding: 16px 12px; }
            /* 手机：按钮行 / 账号密码行 / 起止日期行 / 状态栏，各占一整行 */
            .top-line { gap: 8px; }
            .top-line .tab-nav { flex: 1 1 100%; order: 1; flex-wrap: wrap; }
            .top-line .tab-nav button { flex: 1 1 auto; }
            .top-line .cred-group { flex: 1 1 100%; order: 2; }
            .top-line .date-range { flex: 1 1 100%; order: 3; }
            .top-line .status-bar { flex: 1 1 100%; order: 4; }
            .top-line .cred-input { flex: 1 1 0; width: auto; min-width: 0; }
            .top-line .date-input { flex: 1 1 0; width: auto; min-width: 0; }
            .tab-nav button { padding: 6px 12px; font-size: 12px; }
            .list-side { width: 100%; }
            /* 手机浏览器底部地址栏会悬浮遮挡内容，给内部滚动容器留出底部空间，保证最后的内容能滚动到可见区域 */
            .person-list { padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
            .detail-panel { padding: 10px 12px; padding-bottom: calc(110px + env(safe-area-inset-bottom, 0px)); }
            .detail-header h3 { font-size: 16px; }
            .detail-section .content { font-size: 12.5px; line-height: 1.8; }
            .detail-table { font-size: 11px; }
            .indicator-table { display: block; overflow-x: auto; white-space: nowrap; }
            .browse-wrap.show-detail .list-side { display: none; }
            .browse-wrap.show-detail .btn-back { display: block; }
            .browse-wrap:not(.show-detail) .detail-panel { display: none; }
            .article-body { font-size: 14px; }
            .nav-sep { display: none; }
        }
        @media (max-width: 400px) {
            .header h1 { font-size: 15px; }
            .body { padding: 14px 10px; }
        }
    </style>
</head>

<script>
// ==================== 配置 ====================
const API_BASE = 'https://www.keyclass.cn/studentServer';
const LOGIN_PATH = '/userCommon/userLogin';
const LIST_PATH = '/employee/weekly/getWeeklyList';
const DETAIL_PATH = '/employee/weekly/getWeeklyDetail';
// 热点资讯（论坛）接口
const FORUM_LIST_PATH = '/forumHome/getForumHomePostPage';
const FORUM_DETAIL_PATH = '/forum/getForumPostDetails';
const FORUM_LEARN_LIST_PATH = '/forumLearn/queryForumLearnUserRecord';
const FORUM_LEARN_SAVE_PATH = '/forumLearn/saveForumLearnDuration';
const FORUM_RANK_PATH = '/forumLearn/queryForumRankingList';
const ORIGIN = 'https://qddxt.keyclass.cn';
const REFERER = 'https://qddxt.keyclass.cn/';
const COMPANY_ID = 15;
const PHONE = '';
const PASSWORD = '';

let excelData = [];
// token 持久化：优先从 localStorage 读取上次登录的 token 与凭据，有效期内直接复用、跳过登录
const TOKEN_TTL = 2 * 24 * 60 * 60 * 1000; // token 有效期（毫秒），超时视为失效需重新登录
let authToken = '';
let tokenTs = 0;
let lastLoginCreds = ''; // 记录已登录凭据，凭据变化时自动重新登录
let currentUserId = null; // 登录用户ID（用于判断是否已在文章已学习清单中）
(function restoreToken() {
    try {
        const raw = localStorage.getItem('kc_token');
        if (raw) {
            const o = JSON.parse(raw);
            if (o && o.token && o.ts && (Date.now() - o.ts) < TOKEN_TTL) {
                authToken = o.token;
                tokenTs = o.ts;
                lastLoginCreds = o.key || '';
                currentUserId = o.userId || null;
            }
        }
    } catch (e) {}
})();
function saveToken(key) {
    tokenTs = Date.now();
    try { localStorage.setItem('kc_token', JSON.stringify({ token: authToken, ts: tokenTs, key, userId: currentUserId })); } catch (e) {}
}
function clearToken() {
    authToken = ''; tokenTs = 0; lastLoginCreds = ''; currentUserId = null;
    try { localStorage.removeItem('kc_token'); } catch (e) {}
}

// 初始化日期：上周五 ~ 今天
(function initDates() {
    const today = new Date();
    const dayOfWeek = today.getDay(); // 0=Sun, 1=Mon, ..., 5=Fri, 6=Sat
    // 找最近的周五（今天之前或当天）
    const daysSinceFriday = (dayOfWeek + 2) % 7;
    const friday = new Date(today);
    friday.setDate(today.getDate() - daysSinceFriday);
    document.getElementById('startDate').value = formatDate(friday);
    document.getElementById('endDate').value = formatDate(today);
})();

// 本地日期格式化（避免 toISOString 的 UTC 时区偏移导致日期差一天）
function formatDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
}

// 预填默认账号密码（可手动修改；仅在点击「加载/刷新数据」或「导出周报」时才进行鉴权）
document.getElementById('phoneInput').value = PHONE;
document.getElementById('pwdInput').value = PASSWORD;

// 环境检测（结果记入 envStatus，作为视图未加载数据时的默认状态）
(async function detectEnv() {
    let entry = null;

    try {
        // 尝试访问API检测CORS
        const resp = await fetch(API_BASE + LIST_PATH + '?currentPage=1&pageSize=1', {
            method: 'GET',
            headers: { 'Accept': 'application/json', 'isstudent': '1' },
            credentials: 'include'
        });
        if (resp.ok) {
            entry = { msg: '✅ 检测到当前环境支持API调用，可直接使用', state: 'online' };
        }
    } catch(e) {}

    if (!entry) {
        // 检查是否在同一域名下
        if (window.location.hostname.includes('keyclass.cn') ||
            window.location.hostname.includes('localhost')) {
            entry = { msg: '✅ 在同一域名下运行，可直接使用', state: 'online' };
        } else {
            // file:// 协议或其他域名
            entry = {
                html: '⚠️ 当前从本地打开（file://），浏览器CORS限制将阻止API调用'
                    + '<br><b>解决方法：</b>请在已登录 <a href="https://qddxt.keyclass.cn" target="_blank" style="color:#533483">qddxt.keyclass.cn</a> 的浏览器中打开此HTML文件，或将此HTML文件放到服务器上',
                state: 'error'
            };
        }
    }

    envStatus = entry;
    refreshStatusBar();
})();

// 轻量提示气泡（登录成功/失败等）
let toastTimer = null;
function showToast(msg, type) {
    let t = document.getElementById('toast');
    if (!t) {
        t = document.createElement('div');
        t.id = 'toast';
        t.className = 'toast';
        document.body.appendChild(t);
    }
    t.textContent = msg;
    t.className = 'toast show ' + (type || '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

// 判断接口返回是否为「登录态失效」（token过期），用于自动用已填账号密码重新登录
function isAuthExpired(data) {
    if (!data || data.resultCode === 0) return false;
    const msg = String(data.resultMessage || '');
    return /登录失效|重新登录|登录已过期|登录状态已过期|未登录|请先登录|token/i.test(msg);
}

// 登录鉴权：仅在点击「加载/刷新数据」或「导出周报」时调用
// 已有token且凭据未变时直接复用；force=true 或凭据变化则用当前填入的账号密码重新登录
async function ensureLogin(force = false) {
    const phone = document.getElementById('phoneInput').value.trim();
    const password = document.getElementById('pwdInput').value;
    if (!phone || !password) {
        showToast('⚠️ 请先填写登录账号和密码', 'error');
        throw new Error('请填写登录账号和密码');
    }
    const key = phone + '|' + password;
    // 当前进程已有有效token（凭据未变且未超时），直接复用，不调用登录流程
    if (!force && authToken && key === lastLoginCreds && (Date.now() - tokenTs) < TOKEN_TTL) {
        return;
    }
    try {
        await doLogin(phone, password, COMPANY_ID);
    } catch (e) {
        clearToken();
        showToast('❌ 登录失败：' + e.message, 'error');
        throw e;
    }
    lastLoginCreds = key;
    saveToken(key);
    showToast(`✅ 登录成功（${phone}）`, 'success');
}

// 当前已加载清单的时间范围标识，用于判断是否需要按新范围重新抓取
let listRangeKey = '';

// 报告类型：weeklyType=0 周报（默认，即原接口写死的值）、1 日报、空 全部（跟随下拉框选择）
// 注：经实测 weeklyType=2 在本接口并非周报（返回空），故周报取 0
function getWeeklyType() {
    return document.getElementById('weeklyTypeSel').value;
}
function weeklyTypeLabel() {
    const t = getWeeklyType();
    return t === '1' ? '日报' : (t === '0' ? '周报' : '周报/日报');
}

function getRangeKey() {
    return document.getElementById('startDate').value + '|' + document.getElementById('endDate').value + '|' + getWeeklyType();
}

// 仅抓取周报列表清单（不抓详情），写入 excelData 摘要项，返回条数（0 表示无数据）
async function fetchWeeklyList() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    if (!startDate || !endDate) throw new Error('请选择周报时间范围');
    const weeklyType = getWeeklyType();

    let allWeeklies = [];
    let currentPage = 1;
    let totalRecords = 0;
    const pageSize = 300;
    do {
        const buildListUrl = () => `${LIST_PATH}?queryType=2&weeklyType=${weeklyType}&isView=&departmentId=&startTime=${startDate}&endTime=${endDate}&currentPage=${currentPage}&pageSize=${pageSize}&token=${authToken}&companyId=${COMPANY_ID}`;
        let listData = await apiGet(buildListUrl());
        if (isAuthExpired(listData)) {
            // token失效：清除缓存token，用已填入的账号密码重新登录，再重试当前页
            clearToken();
            await ensureLogin(true);
            listData = await apiGet(buildListUrl());
        }
        if (!listData || listData.resultCode !== 0) {
            throw new Error(`获取周报列表失败: ${listData?.resultMessage || '未知错误'}`);
        }
        const records = listData.resultData || [];
        if (records.length === 0) break;
        totalRecords = listData.totalCount || 0;
        allWeeklies = allWeeklies.concat(records);
        if (allWeeklies.length >= totalRecords) break;
        currentPage++;
    } while (true);

    // 摘要项：仅含名单展示所需字段，详情（正文/指标）点击人名时再按需加载
    excelData = allWeeklies.map(w => ({
        name: w.trueName || '',
        department: w.depTitle || '',
        position: w.jobName || '',
        submitTime: w.lastSubmitTime || w.firstSubmitTime || '',
        weeklyId: w.weeklyId,
        viewCount: w.isViewNum || 0,
        noViewCount: w.noViewNum || 0,
        listRecord: w,
        detailLoaded: false
    }));
    listRangeKey = getRangeKey();
    return excelData.length;
}

// 按需获取单人周报详情并合并进摘要项（detailLoaded 缓存，避免重复请求）
async function ensureWeeklyDetail(d) {
    if (d.detailLoaded || d.detailLoading) return;
    d.detailLoading = true;
    try {
        const buildDetailUrl = () => `${DETAIL_PATH}?weeklyId=${d.weeklyId}&token=${authToken}&companyId=${COMPANY_ID}`;
        let detailData = await apiGet(buildDetailUrl());
        if (isAuthExpired(detailData)) {
            // token失效：清除缓存token，用已填入的账号密码重新登录后重试
            clearToken();
            await ensureLogin(true);
            detailData = await apiGet(buildDetailUrl());
        }
        if (!detailData || detailData.resultCode !== 0 || !detailData.resultData) {
            throw new Error(detailData?.resultMessage || '未知错误');
        }
        Object.assign(d, parseWeeklyData(detailData.resultData, d.listRecord));
        d.detailLoaded = true;
    } finally {
        d.detailLoading = false;
    }
}

// 导出用：抓取所有未加载的详情（已浏览过的复用缓存，跳过请求）
async function fetchAllDetails(onItem) {
    const total = excelData.length;
    for (let i = 0; i < total; i++) {
        const d = excelData[i];
        if (onItem) onItem(i + 1, total, d.name);
        if (!d.detailLoaded) {
            try {
                await ensureWeeklyDetail(d);
            } catch (e) { console.warn(e); }
            await sleep(150);
        }
    }
    return total;
}

// 抓取完成后统一刷新浏览区
function syncBrowseAfterLoad() {
    selectedPersonIndex = -1;
    leaveDetailView('browseWrap');
    resetDetailPanel();
    document.getElementById('personSearch').value = '';
    populateDeptFilter();
    document.getElementById('deptFilter').value = '';
    renderPersonList();
}

// 导出周报：登录鉴权 → 确保清单已加载 → 补抓全部详情 → 生成Excel（详情缓存同步到在线浏览区）
async function runExport() {
    const btn = document.getElementById('tabBtnExport');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    btn.disabled = true;
    progressBar.style.display = 'block';
    progressText.style.display = 'block';
    try {
        updateBrowseStatus('正在登录鉴权...', 'checking', 'weekly');
        await ensureLogin();
        // 清单未加载或时间范围/报告类型已变更时，先重新抓取清单
        if (getRangeKey() !== listRangeKey) {
            updateBrowseStatus(`正在获取${weeklyTypeLabel()}列表...`, 'checking', 'weekly');
            await fetchWeeklyList();
            syncBrowseAfterLoad();
        }
        if (excelData.length === 0) {
            progressText.textContent = `⚠️ 指定时间范围内没有${weeklyTypeLabel()}数据`;
            updateBrowseStatus(`⚠️ 指定时间范围内没有${weeklyTypeLabel()}数据，未生成Excel`, 'error', 'weekly');
            return;
        }
        updateBrowseStatus('正在抓取周报详情...', 'checking', 'weekly');
        const count = await fetchAllDetails((i, total, name) => {
            const pct = Math.round((i / total) * 100);
            progressFill.style.width = pct + '%';
            progressText.textContent = `正在获取详情: ${i}/${total} (${pct}%) - ${name}`;
        });
        progressFill.style.width = '100%';
        progressText.textContent = `✅ 导出完成！共 ${count} 条数据`;
        updateBrowseStatus(`✅ 已加载 ${count} 条${weeklyTypeLabel()}数据，Excel已生成`, 'online', 'weekly');
        downloadExcel();
        excelGenerated = true;
        refreshStatusBar();
    } catch (err) {
        console.error(err);
        progressText.textContent = `❌ 导出失败: ${err.message}`;
        updateBrowseStatus(`❌ 导出失败: ${err.message}`, 'error', 'weekly');
    } finally {
        btn.disabled = false;
        setTimeout(() => {
            progressBar.style.display = 'none';
            progressText.style.display = 'none';
        }, 4000);
    }
}

async function doLogin(phone, password, companyId) {
    const data = await apiRequest(LOGIN_PATH, 'POST', {
        loginId: phone,
        password: password,
        isApp: 2,
        loginType: 2,
        companyId: companyId,
        languageType: null
    });
    if (!data || data.resultCode !== 0) {
        throw new Error(`登录失败: ${data?.resultMessage || '未知错误'}`);
    }
    const token = extractTokenFromResponse(data);
    if (token) {
        authToken = token;
        currentUserId = extractUserIdFromResponse(data);
        log('success', `✅ 登录成功！Token: ${token.substring(0, 12)}... 用户ID: ${currentUserId ?? '未获取到'}`);
    } else {
        log('warn', '⚠️ 登录成功但未获取到Token，请检查接口响应');
        throw new Error('未获取到有效Token，请确认账号密码正确');
    }
}

function extractTokenFromResponse(data) {
    if (data.token) return data.token;
    if (data.resultData?.token) return data.resultData.token;
    return null;
}

// 从登录响应中提取当前用户ID（兼容常见字段名），用于判断是否已在已学习清单中
function extractUserIdFromResponse(data) {
    const rd = data.resultData || {};
    const cand = rd.userId ?? rd.id ?? rd.postUserId ?? data.userId ?? data.id;
    return cand != null ? Number(cand) : null;
}

async function apiGet(path) {
    const url = API_BASE + path;
    const headers = buildHeaders();
    headers['Accept'] = 'application/json';

    const resp = await fetch(url, {
        method: 'GET',
        headers: headers,
        credentials: 'include'
    });
    return await resp.json();
}

async function apiRequest(path, method, body) {
    const url = API_BASE + (path.startsWith('/') ? path : '/' + path);
    const headers = buildHeaders();

    const resp = await fetch(url, {
        method: method,
        headers: headers,
        body: body ? JSON.stringify(body) : undefined,
        credentials: 'include'
    });
    return await resp.json();
}

function buildHeaders() {
    return {
        'Accept': 'application/json, text/plain, */*',
        'Origin': ORIGIN,
        'Referer': REFERER,
        'isstudent': '1',
        'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/151.0.0.0 Safari/537.36 Edg/151.0.0.0',
        'Content-Type': 'application/json'
    };
}

function parseWeeklyData(data, summary) {
    return {
        name: data.trueName || summary.trueName || '',
        department: summary.depTitle || '',
        position: summary.jobName || '',
        submitTime: data.lastSubmitTime || data.firstSubmitTime || '',
        weeklyId: data.weeklyId || summary.weeklyId || '',
        priority: stripHtml(data.priority || ''),
        intergrowth: stripHtml(data.intergrowth || ''),
        afterPriority: stripHtml(data.afterPriority || ''),
        introspection: stripHtml(data.introspection || ''),
        selfStudy: stripHtml(data.selfStudy || ''),
        imageUrls: extractImageUrls(data.priority || ''),
        viewCount: summary.isViewNum || 0,
        noViewCount: summary.noViewNum || 0,
        constantMap: data.constantMap || null,
        raw: data
    };
}

function stripHtml(html) {
    if (!html) return '';
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    return tmp.textContent || tmp.innerText || '';
}

function extractImageUrls(html) {
    if (!html) return [];
    const urls = [];
    const regex = /<img[^>]+src=["']([^"']+)["'][^>]*>/gi;
    let match;
    while ((match = regex.exec(html)) !== null) {
        urls.push(match[1]);
    }
    return urls;
}

function downloadExcel() {
    if (excelData.length === 0) {
        alert('暂无数据可导出！');
        return;
    }

    const wb = XLSX.utils.book_new();
    const rows = excelData.map(d => {
        // 将 constantMap 所有指标合并成一段文本
        let indicatorText = '';
        if (d.constantMap) {
            const entries = [];
            Object.values(d.constantMap).forEach(arr => {
                arr.forEach(c => {
                    if (c.constantName) {
                        entries.push({
                            name: c.constantName,
                            target: c.target || '',
                            units: c.units || '',
                            lastProgress: c.lastProgress || '',
                            progress: c.progress || '',
                            progressSum: c.progressSum || ''
                        });
                    }
                });
            });
            entries.forEach((e, i) => {
                indicatorText += `${i + 1}、${e.name}：目标 ${e.target}，单位 ${e.units}，上周进度 ${e.lastProgress}，本周进度 ${e.progress}，累计进度 ${e.progressSum}。\n`;
            });
        }

        return {
            '序号': '',
            '姓名': d.name,
            '部门': d.department,
            '职位': d.position,
            '提交时间': d.submitTime,
            '本周重点工作': d.priority,
            '共生文化': d.intergrowth,
            '下周工作计划': d.afterPriority,
            '反思': d.introspection,
            '自我学习': d.selfStudy,
            '图片附件数': (d.imageUrls || []).length,
            '个人指标': indicatorText.trim()
        };
    });

    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [
        { wch: 6 }, { wch: 10 }, { wch: 20 }, { wch: 14 }, { wch: 20 },
        { wch: 65 }, { wch: 40 }, { wch: 65 }, { wch: 50 },
        { wch: 40 }, { wch: 10 }, { wch: 60 }
    ];

    // 设置序号列
    for (let i = 0; i < excelData.length; i++) {
        ws[`A${i + 2}`] = { t: 'n', v: i + 1 };
    }

    // 文件名/工作表名按报告类型命名（周报默认与原逻辑一致）
    const fileLabel = getWeeklyType() === '1' ? '日报' : (getWeeklyType() === '0' ? '周报' : '汇总');
    XLSX.utils.book_append_sheet(wb, ws, fileLabel === '汇总' ? '汇总' : `${fileLabel}汇总`);
    const filename = `大学堂${fileLabel}_${formatDate(new Date())}.xlsx`;
    XLSX.writeFile(wb, filename);
    log('success', `📥 Excel已下载: ${filename}`);
}

// 日志输出到控制台（页面进度统一展示在顶部进度条与状态行）
function log(type, msg) { console.log(`[${type}] ${msg}`); }

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// ==================== 在线浏览 ====================
let selectedPersonIndex = -1;
let currentDetailImages = [];

// 页面默认即为「在线浏览」视图（body.browse-mode 固定），无需Tab切换逻辑
// 状态信息统一显示在顶栏状态栏（合并了「环境检测」与「加载结果」两个信息栏）
// 状态栏为周报/资讯两个视图共用：按视图分别记录状态，切换视图时恢复对应状态，避免与当前显示内容不匹配
let viewStatus = { weekly: null, news: null }; // 各视图最近一次状态 { msg | html, state }
let envStatus = null;                          // 环境检测结果，作为视图尚未加载数据时的默认状态
let excelGenerated = false;                    // 是否已生成周报Excel（控制「重新下载Excel」按钮）

function renderStatusEntry(entry) {
    const text = document.getElementById('statusText');
    const dot = document.getElementById('statusDot');
    if (entry.html) text.innerHTML = entry.html;
    else text.textContent = entry.msg || '';
    if (entry.state === 'error') {
        dot.className = 'status-dot offline';
        text.style.color = '#f44336';
    } else if (entry.state === 'checking') {
        dot.className = 'status-dot checking';
        text.style.color = '';
    } else {
        dot.className = 'status-dot online';
        text.style.color = '';
    }
}

// 视图从未加载过数据时的默认状态：有数据则按数据量提示，否则回退到环境检测结果
function defaultStatusForView(view) {
    if (view === 'weekly') {
        if (excelData.length > 0) return { msg: `✅ 已加载 ${excelData.length} 条${weeklyTypeLabel()}清单，点击人名查看详情`, state: 'online' };
    } else if (newsData.length > 0) {
        return { msg: `✅ ${newsPageStatusText()}，点击文章查看内容`, state: 'online' };
    }
    return envStatus;
}

// 按当前视图刷新状态栏与「重新下载Excel」按钮（该按钮仅周报视图且已生成Excel时显示）
function refreshStatusBar() {
    const entry = viewStatus[currentView] || defaultStatusForView(currentView);
    if (entry) renderStatusEntry(entry);
    document.getElementById('redownloadBtn').style.display =
        (currentView === 'weekly' && excelGenerated) ? 'inline-block' : 'none';
    // 发贴统计按钮：仅热点资讯视图且已加载数据时显示
    document.getElementById('newsStatsBtn').style.display =
        (currentView === 'news' && newsData.length > 0) ? 'inline-block' : 'none';
}

function updateBrowseStatus(msg, state, view) {
    viewStatus[view || currentView] = { msg, state };
    refreshStatusBar();
}

// 浏览页加载/刷新数据：先鉴权，再按当前时间范围抓取清单（仅浏览，详情点击人名时才加载）
async function loadBrowseData() {
    const btn = document.getElementById('loadBrowseBtn');
    btn.disabled = true;
    updateBrowseStatus('正在登录鉴权...', 'checking');
    try {
        await ensureLogin();
        updateBrowseStatus(`正在获取${weeklyTypeLabel()}列表...`, 'checking');
        const count = await fetchWeeklyList();
        syncBrowseAfterLoad();
        if (count === 0) {
            updateBrowseStatus(`⚠️ 指定时间范围内没有${weeklyTypeLabel()}数据`, 'error');
        } else {
            updateBrowseStatus(`✅ 已加载 ${count} 条${weeklyTypeLabel()}清单，点击人名查看详情`);
        }
    } catch (err) {
        updateBrowseStatus(`❌ 加载失败: ${err.message}`, 'error');
    } finally {
        btn.disabled = false;
    }
}

function resetDetailPanel() {
    document.getElementById('detailPanel').innerHTML =
        '<div class="empty-tip">👈 点击左侧人名查看周报详情</div>';
}

// 填充部门下拉筛选（按数据中的部门去重统计，带人数）
function populateDeptFilter() {
    const sel = document.getElementById('deptFilter');
    const prev = sel.value;
    const counts = {};
    excelData.forEach(d => {
        const dep = (d.department || '').trim();
        if (dep) counts[dep] = (counts[dep] || 0) + 1;
    });
    const depts = Object.keys(counts).sort((a, b) => a.localeCompare(b, 'zh'));
    sel.innerHTML = '<option value="">全部部门</option>' +
        depts.map(dep => `<option value="${escapeHtml(dep)}">${escapeHtml(dep)} (${counts[dep]})</option>`).join('');
    sel.value = depts.includes(prev) ? prev : '';
}

// 周报清单按当前筛选条件过滤（人名列表渲染与状态栏计数共用）
function filterWeeklyItems() {
    const kw = (document.getElementById('personSearch').value || '').trim().toLowerCase();
    const dept = document.getElementById('deptFilter').value;
    return excelData
        .map((d, i) => ({ d, i }))
        .filter(({ d }) => (!dept || (d.department || '').trim() === dept)
            && (!kw
                || (d.name || '').toLowerCase().includes(kw)
                || (d.department || '').toLowerCase().includes(kw)
                || (d.position || '').toLowerCase().includes(kw)));
}

// 筛选激活时的状态栏提示文案（无筛选返回 null）
function weeklyFilterStatusText() {
    if (excelData.length === 0) return null;
    const kw = (document.getElementById('personSearch').value || '').trim();
    const dept = document.getElementById('deptFilter').value;
    if (!kw && !dept) return null;
    const n = filterWeeklyItems().length;
    const parts = [];
    if (kw) parts.push(`关键词「${kw}」`);
    if (dept) parts.push(`部门「${dept}」`);
    return `🔍 ${parts.join(' · ')}：匹配 ${n} / ${excelData.length} 条`;
}

function newsFilterStatusText() {
    if (newsData.length === 0) return null;
    const kw = (document.getElementById('newsSearch').value || '').trim();
    const topOnly = document.getElementById('topFilter').value === '1';
    if (!kw && !topOnly) return null;
    const n = getFilteredNewsItems().length;
    const parts = [];
    if (kw) parts.push(`关键词「${kw}」`);
    if (topOnly) parts.push('仅看置顶');
    return `🔍 ${parts.join(' · ')}：匹配 ${n} / ${newsData.length} 篇`;
}

// 筛选变更后同步状态栏：有筛选显示命中数量，筛选清空后恢复默认加载提示
const filterStatusActive = { weekly: false, news: false };
function syncFilterStatus(view) {
    const text = view === 'weekly' ? weeklyFilterStatusText() : newsFilterStatusText();
    if (text) {
        filterStatusActive[view] = true;
        updateBrowseStatus(text, 'online', view);
    } else if (filterStatusActive[view]) {
        filterStatusActive[view] = false;
        const d = defaultStatusForView(view);
        if (d && d.msg) updateBrowseStatus(d.msg, 'online', view);
    }
}

function renderPersonList() {
    const listEl = document.getElementById('personList');
    if (excelData.length === 0) {
        listEl.innerHTML = '<div class="empty-tip">暂无数据</div>';
        return;
    }
    const items = filterWeeklyItems();

    listEl.innerHTML = items.length === 0
        ? '<div class="empty-tip">未找到匹配人员</div>'
        : items.map(({ d, i }) => `
            <div class="person-card ${i === selectedPersonIndex ? 'active' : ''}" onclick="selectPerson(${i})">
                <div class="p-name">${escapeHtml(d.name || '未知')}</div>
                <div class="p-meta">
                    ${escapeHtml(d.department || '')}${d.position ? ' · ' + escapeHtml(d.position) : ''}<br>
                    提交：${escapeHtml(d.submitTime || '-')}
                </div>
            </div>`).join('');
    syncFilterStatus('weekly');
}

// 点击人名：按需抓取该人员的周报详情（懒加载），再渲染详情面板
async function selectPerson(index) {
    selectedPersonIndex = index;
    enterDetailView('browseWrap');
    renderPersonList();
    const d = excelData[index];
    if (!d) return;
    const panel = document.getElementById('detailPanel');
    if (!d.detailLoaded) {
        if (d.detailLoading) return; // 已有请求进行中，避免重复触发
        panel.innerHTML = `<div class="empty-tip">⏳ 正在获取 ${escapeHtml(d.name || '')} 的周报详情...</div>`;
        try {
            await ensureWeeklyDetail(d);
        } catch (e) {
            if (selectedPersonIndex !== index) return; // 期间已切换到其他人员
            panel.innerHTML = `<div class="empty-tip">❌ 获取周报详情失败：${escapeHtml(e.message)}<br><button class="btn btn-primary btn-xs" style="margin-top:10px" onclick="selectPerson(${index})">🔄 重试</button></div>`;
            return;
        }
    }
    if (selectedPersonIndex !== index) return; // 期间已切换到其他人员
    renderPersonDetail(d);
}

// —— 详情页历史记录管理 ——
// 进入详情时压入一条历史记录：手机/浏览器的返回键即可返回列表，而不会直接退出工具页面
function enterDetailView(wrapId) {
    const wrap = document.getElementById(wrapId);
    if (wrap.classList.contains('show-detail')) return;
    wrap.classList.add('show-detail');
    // 若历史栈顶已是详情记录（如刷新后残留），直接复用，避免堆积
    if (!(history.state && history.state.detail)) {
        try { history.pushState({ detail: true }, ''); } catch (e) { /* 环境不支持时仅靠按钮返回 */ }
    }
}

let detailLeavePending = false; // 由页面按钮触发 history.back() 时，popstate 无需重复关闭
function leaveDetailView(wrapId) {
    document.getElementById(wrapId).classList.remove('show-detail');
    if (history.state && history.state.detail) {
        detailLeavePending = true;
        history.back(); // 消耗掉压入的历史记录，保持历史栈同步
    }
}

// 返回键（浏览器/手机手势）：从详情回到列表视图，而不是退出页面
window.addEventListener('popstate', () => {
    if (detailLeavePending) { detailLeavePending = false; return; }
    ['browseWrap', 'newsWrap'].forEach(id => {
        const w = document.getElementById(id);
        if (w) w.classList.remove('show-detail');
    });
});

function backToList() {
    leaveDetailView('browseWrap');
}

// 检测原始HTML中的<table>/<img>，按原文顺序提取内容块 [{type:'text'|'table'|'image', ...}]，无表格且无图片返回 null
function extractFieldBlocks(html) {
    if (!html || !/<(table|img)[\s>]/i.test(html)) return null;
    const tmp = document.createElement('div');
    tmp.innerHTML = html;

    const blocks = [];
    let textBuf = '';

    const flushText = () => {
        const t = htmlToText(textBuf);
        if (t) blocks.push({ type: 'text', text: t });
        textBuf = '';
    };

    // 将表格重建为干净表格HTML
    const rebuildTable = (tbl) => {
        const rows = [];
        tbl.querySelectorAll('tr').forEach(tr => {
            const cells = [];
            tr.querySelectorAll('th,td').forEach(cell => {
                const colspan = cell.getAttribute('colspan');
                const rowspan = cell.getAttribute('rowspan');
                const attrs = (colspan && colspan !== '1' ? ` colspan="${escapeHtml(colspan)}"` : '')
                            + (rowspan && rowspan !== '1' ? ` rowspan="${escapeHtml(rowspan)}"` : '');
                cells.push({ text: htmlToText(cell.innerHTML), attrs });
            });
            if (cells.some(c => c.text !== '')) rows.push(cells);
        });
        if (rows.length === 0) return '';
        // 首行含 th 或有多行时，首行按表头渲染
        const firstHeader = !!tbl.querySelector('tr th') || rows.length > 1;
        let t = '<table class="detail-table">';
        rows.forEach((cells, ri) => {
            const tag = (ri === 0 && firstHeader) ? 'th' : 'td';
            t += '<tr>' + cells.map(c => `<${tag}${c.attrs}>${escapeHtml(c.text)}</${tag}>`).join('') + '</tr>';
        });
        return t + '</table>';
    };

    // 按文档顺序遍历：表格即时产出内容块，其余归入文本缓冲，保持「文字、表格」的原始顺序
    const walk = (node) => {
        Array.from(node.childNodes).forEach(child => {
            if (child.nodeType === 3) { textBuf += child.textContent + '\n'; return; }
            if (child.nodeType !== 1) return;
            if (child.tagName === 'TABLE') {
                const rebuilt = rebuildTable(child);
                if (rebuilt) { flushText(); blocks.push({ type: 'table', html: rebuilt }); }
                return;
            }
            if (child.tagName === 'IMG') {
                const src = child.getAttribute('src');
                if (src) { flushText(); blocks.push({ type: 'image', url: src }); }
                return;
            }
            if (child.querySelector && child.querySelector('table,img')) {
                walk(child); // 容器内嵌表格，递归展开以保持顺序
                return;
            }
            textBuf += child.outerHTML + '\n';
        });
    };
    walk(tmp);
    flushText();

    return blocks.some(b => b.type === 'table' || b.type === 'image') ? blocks : null;
}

function renderPersonDetail(d) {
    const panel = document.getElementById('detailPanel');
    currentDetailImages = collectAllImages(d);
    const indicatorRows = buildIndicatorRows(d);

    const section = (title, key) => {
        const raw = d.raw && d.raw[key] ? d.raw[key] : '';
        const blocks = extractFieldBlocks(raw);
        let body;
        if (blocks) {
            // 按原文顺序渲染：文字段落、表格、图片交替出现（图文混排）
            body = blocks.map(b => {
                if (b.type === 'table') return `<div class="table-scroll">${b.html}</div>`;
                if (b.type === 'image') {
                    const idx = currentDetailImages.indexOf(b.url);
                    const click = idx >= 0 ? ` onclick="openImage(${idx})"` : '';
                    return `<div class="inline-img-wrap"><img class="inline-img" src="${escapeHtml(b.url)}" alt="图片" loading="lazy"${click} onerror="this.parentElement.style.display='none'"></div>`;
                }
                return `<div class="content">${escapeHtml(b.text)}</div>`;
            }).join('');
            if (!body) body = '<div class="content"><span style="color:#bbb">（无内容）</span></div>';
        } else {
            const text = fieldText(d, key);
            body = `<div class="content">${text ? escapeHtml(text) : '<span style="color:#bbb">（无内容）</span>'}</div>`;
        }
        return `<div class="detail-section"><h4>${title}</h4>${body}</div>`;
    };

    panel.innerHTML = `
        <button class="btn-back" onclick="backToList()">← 返回列表</button>
        <div class="detail-header">
            <h3>${escapeHtml(d.name || '')}</h3>
            <div class="d-meta">
                ${escapeHtml(d.department || '')}${d.position ? ' · ' + escapeHtml(d.position) : ''}
                ${d.submitTime ? '<br>提交时间：' + escapeHtml(d.submitTime) : ''}
            </div>
        </div>
        ${section('本周重点工作', 'priority')}
        ${section('下周工作计划', 'afterPriority')}
        ${section('反思', 'introspection')}
        ${indicatorRows ? `
        <div class="detail-section">
            <h4>个人指标</h4>
            <table class="indicator-table">
                <tr><th>指标</th><th>目标</th><th>单位</th><th>上周进度</th><th>本周进度</th><th>累计进度</th></tr>
                ${indicatorRows}
            </table>
        </div>` : ''}
        ${section('共生文化', 'intergrowth')}
        ${section('自我学习', 'selfStudy')}
    `;
    panel.scrollTop = 0;
}

function openImage(i) {
    const u = currentDetailImages[i];
    if (u) window.open(u, '_blank');
}

// 优先从原始HTML还原段落换行，保证浏览时可读性
function fieldText(d, key) {
    if (d.raw && d.raw[key]) return htmlToText(d.raw[key]);
    return d[key] || '';
}

function htmlToText(html) {
    if (!html) return '';
    let s = String(html)
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/<\/(p|div|li|h[1-6]|tr|section|blockquote)>/gi, '\n')
        .replace(/<li[^>]*>/gi, '• ');
    const tmp = document.createElement('div');
    tmp.innerHTML = s;
    return (tmp.textContent || '')
        .replace(/\u00a0/g, ' ')
        .replace(/[ \t]+\n/g, '\n')
        .replace(/\n{3,}/g, '\n\n')
        .trim();
}

// 从原始数据所有字段提取图片（仅浏览展示，不影响Excel的图片统计口径）
function collectAllImages(d) {
    let urls = [];
    if (d.raw) {
        ['priority', 'intergrowth', 'afterPriority', 'introspection', 'selfStudy'].forEach(k => {
            urls = urls.concat(extractImageUrls(d.raw[k] || ''));
        });
    }
    return [...new Set(urls)];
}

function buildIndicatorRows(d) {
    if (!d.constantMap) return '';
    let rows = '';
    Object.values(d.constantMap).forEach(arr => {
        (arr || []).forEach(c => {
            if (c.constantName) {
                rows += `<tr>
                    <td>${escapeHtml(c.constantName)}</td>
                    <td>${escapeHtml(c.target ?? '-')}</td>
                    <td>${escapeHtml(c.units ?? '-')}</td>
                    <td>${escapeHtml(c.lastProgress ?? '-')}</td>
                    <td>${escapeHtml(c.progress ?? '-')}</td>
                    <td>${escapeHtml(c.progressSum ?? '-')}</td>
                </tr>`;
                // 指标备注（explainInfo，无则用评分说明）
                const remark = String(c.explainInfo ?? c.ratingScoreExplain ?? '').trim();
                if (remark) {
                    rows += `<tr class="indicator-remark"><td colspan="6">备注：${escapeHtml(remark)}</td></tr>`;
                }
            }
        });
    });
    return rows;
}

function escapeHtml(s) {
    return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

// ==================== 热点资讯 ====================
let newsData = [];        // 文章列表摘要（当前页或全部）
let selectedNewsIndex = -1;
let newsDetailCache = {}; // postId -> 详情，避免重复请求
let newsSelectedIds = new Set(); // 批量下载选中的文章（String(postId)，跨筛选/翻页保留）
const NEWS_PAGE_SIZE = 100; // 分页模式每页条数
let newsPage = 1;           // 当前页码（分页模式）
let newsTotalCount = 0;     // 文章总数（接口返回）
let newsLoaded = false;     // 是否已成功加载过列表
let newsPagingBusy = false; // 翻页请求进行中，防止重复点击

// 加载热点资讯：复用登录token → 按分页模式下拉框选择「每页100（可翻页）」或「全部（一次性拉取）」
async function loadNewsData() {
    const btn = document.getElementById('loadNewsBtn');
    btn.disabled = true;
    updateBrowseStatus('正在登录鉴权...', 'checking');
    try {
        await ensureLogin();
        updateBrowseStatus('正在获取热点资讯列表...', 'checking');
        newsPage = 1; // 手动点击加载时回到第1页
        if (newsPageSizeMode() === 'all') {
            await fetchNewsListAll();
        } else {
            await fetchNewsPage(newsPage);
        }
        newsLoaded = true;
        syncNewsAfterLoad();
        if (newsData.length === 0) {
            updateBrowseStatus('⚠️ 没有获取到热点资讯文章', 'error');
        } else {
            updateBrowseStatus(`✅ ${newsPageStatusText()}，点击文章查看内容`);
        }
        // 同步获取阅读量排名（失败不影响资讯列表）
        try { await fetchRanking(); } catch (e) { console.warn('获取阅读量排名失败:', e); }
    } catch (err) {
        updateBrowseStatus(`❌ 加载失败: ${err.message}`, 'error');
    } finally {
        btn.disabled = false;
    }
}

// 分页模式：'100' 每页100条并翻页 / 'all' 一次性获取全部
function newsPageSizeMode() {
    return document.getElementById('newsPageSizeSel').value;
}

// 状态栏提示文案：分页模式下显示当前页/总页数与总数
function newsPageStatusText() {
    if (newsPageSizeMode() !== 'all' && newsTotalCount > NEWS_PAGE_SIZE) {
        return `已加载第 ${newsPage}/${newsTotalPages()} 页（共 ${newsTotalCount} 篇）`;
    }
    return `已加载 ${newsData.length} 篇热点资讯`;
}

function newsTotalPages() {
    return Math.max(1, Math.ceil(newsTotalCount / NEWS_PAGE_SIZE));
}

// 分页模式：抓取指定页（currentPage + pageSize=100），并记录 totalCount
async function fetchNewsPage(page) {
    const buildUrl = () =>
        `${FORUM_LIST_PATH}?keyWord=&plateId=&currentPage=${page}&pageSize=${NEWS_PAGE_SIZE}&token=${authToken}&companyId=${COMPANY_ID}`;
    let data = await apiGet(buildUrl());
    if (isAuthExpired(data)) {
        clearToken();
        await ensureLogin(true);
        data = await apiGet(buildUrl());
    }
    if (!data || data.resultCode !== 0) {
        throw new Error(`获取热点资讯列表失败: ${data?.resultMessage || '未知错误'}`);
    }
    newsTotalCount = data.totalCount || 0;
    newsPage = page;
    newsData = mapNewsRecords(data.resultData || []);
    return newsData.length;
}

// 全部模式：第一次查询取 totalCount，再以 pageSize=totalCount 一次性拉全
async function fetchNewsListAll() {
    const buildUrl = (page, size) =>
        `${FORUM_LIST_PATH}?keyWord=&plateId=&currentPage=${page}&pageSize=${size}&token=${authToken}&companyId=${COMPANY_ID}`;

    // 第一次：探测总数
    let first = await apiGet(buildUrl(1, 20));
    if (isAuthExpired(first)) {
        clearToken();
        await ensureLogin(true);
        first = await apiGet(buildUrl(1, 20));
    }
    if (!first || first.resultCode !== 0) {
        throw new Error(`获取热点资讯列表失败: ${first?.resultMessage || '未知错误'}`);
    }
    const totalCount = first.totalCount || 0;
    let records = first.resultData || [];

    // 一次性获取全部（pageSize = totalCount）
    if (totalCount > records.length) {
        let all = await apiGet(buildUrl(1, totalCount));
        if (isAuthExpired(all)) {
            clearToken();
            await ensureLogin(true);
            all = await apiGet(buildUrl(1, totalCount));
        }
        if (all && all.resultCode === 0 && Array.isArray(all.resultData) && all.resultData.length) {
            records = all.resultData;
        }
    }

    newsTotalCount = totalCount;
    newsData = mapNewsRecords(records);
    return newsData.length;
}

function mapNewsRecords(records) {
    return records.map(p => ({
        postId: p.postId,
        title: p.title || '',
        createTime: p.createTime || '',
        userName: p.userName || '',
        readNum: p.readNum || 0,
        likedNum: p.likedNum || 0,
        commentNum: p.commentNum || 0,
        recommendFlag: p.recommendFlag || 0,
        detailLoaded: false
    }));
}

// 切换分页模式：已加载过数据时，回到第1页按新模式重新抓取
async function onNewsPageSizeChange() {
    newsPage = 1;
    renderNewsPager();
    if (!newsLoaded) return; // 尚未加载，仅记住选择
    const btn = document.getElementById('loadNewsBtn');
    btn.disabled = true;
    updateBrowseStatus('正在获取热点资讯列表...', 'checking');
    try {
        if (newsPageSizeMode() === 'all') {
            await fetchNewsListAll();
        } else {
            await fetchNewsPage(1);
        }
        syncNewsAfterLoad();
        updateBrowseStatus(`✅ ${newsPageStatusText()}，点击文章查看内容`);
    } catch (err) {
        updateBrowseStatus(`❌ 加载失败: ${err.message}`, 'error');
    } finally {
        btn.disabled = false;
    }
}

// 翻页：首页/上页/下页按钮统一入口
async function newsGoPage(page) {
    if (newsPagingBusy) return;
    const target = Math.min(Math.max(1, page), newsTotalPages());
    if (target === newsPage) return;
    newsPagingBusy = true;
    renderNewsPager();
    updateBrowseStatus('正在获取热点资讯列表...', 'checking');
    try {
        await fetchNewsPage(target);
        // 保留搜索/置顶筛选条件，仅重置选中项与详情面板
        selectedNewsIndex = -1;
        leaveDetailView('newsWrap');
        resetNewsDetailPanel();
        renderNewsList();
        renderNewsPager();
        updateBrowseStatus(`✅ ${newsPageStatusText()}，点击文章查看内容`);
    } catch (err) {
        updateBrowseStatus(`❌ 翻页失败: ${err.message}`, 'error');
    } finally {
        newsPagingBusy = false;
        renderNewsPager();
    }
}

// 渲染分页控件：仅「每页100」模式且总数超过一页时显示
function renderNewsPager() {
    const pager = document.getElementById('newsPager');
    if (!pager) return;
    const show = newsLoaded && newsPageSizeMode() === '100' && newsTotalCount > NEWS_PAGE_SIZE;
    pager.style.display = show ? 'flex' : 'none';
    if (!show) return;
    const totalPages = newsTotalPages();
    document.getElementById('pgInfo').textContent = `第 ${newsPage}/${totalPages} 页`;
    document.getElementById('pgFirst').disabled = newsPagingBusy || newsPage <= 1;
    document.getElementById('pgPrev').disabled = newsPagingBusy || newsPage <= 1;
    document.getElementById('pgNext').disabled = newsPagingBusy || newsPage >= totalPages;
}

function syncNewsAfterLoad() {
    selectedNewsIndex = -1;
    leaveDetailView('newsWrap');
    resetNewsDetailPanel();
    document.getElementById('newsSearch').value = '';
    document.getElementById('topFilter').value = '';
    newsSelectedIds.clear(); // 重新加载/切换分页模式：筛选上下文已重置，清空已选状态
    renderNewsList();
    renderNewsPager();
}

function resetNewsDetailPanel() {
    document.getElementById('newsDetailPanel').innerHTML =
        '<div class="empty-tip">👈 点击左侧文章查看内容详情</div>';
}

// 当前搜索关键词/置顶筛选命中的文章（列表渲染与「全选当前结果」共用）
function getFilteredNewsItems() {
    const kw = (document.getElementById('newsSearch').value || '').trim().toLowerCase();
    const topOnly = document.getElementById('topFilter').value === '1';
    return newsData
        .map((d, i) => ({ d, i }))
        .filter(({ d }) => (!topOnly || d.recommendFlag === 1)
            && (!kw
                || (d.title || '').toLowerCase().includes(kw)
                || (d.userName || '').toLowerCase().includes(kw)));
}

function renderNewsList() {
    const listEl = document.getElementById('newsList');
    document.getElementById('newsBulkBar').classList.toggle('show', newsData.length > 0);
    if (newsData.length === 0) {
        listEl.innerHTML = '<div class="empty-tip">暂无数据，点击「加载热点资讯」获取文章列表</div>';
        return;
    }
    const items = getFilteredNewsItems();

    listEl.innerHTML = items.length === 0
        ? '<div class="empty-tip">未找到匹配文章</div>'
        : items.map(({ d, i }) => `
            <div class="person-card ${i === selectedNewsIndex ? 'active' : ''} ${newsSelectedIds.has(String(d.postId)) ? 'checked' : ''}" onclick="selectNews(${i})">
                <label class="news-check" title="选择文章（批量下载用）" onclick="event.stopPropagation()">
                    <input type="checkbox" ${newsSelectedIds.has(String(d.postId)) ? 'checked' : ''} onchange="onNewsCheck(this, '${String(d.postId)}')">
                </label>
                <div class="p-title">${d.recommendFlag === 1 ? '<span class="p-top">置顶</span>' : ''}${escapeHtml(d.title || '无标题')}</div>
                <div class="p-meta">
                    ${escapeHtml(d.userName || '-')} · ${escapeHtml((d.createTime || '').slice(0, 10))}<br>
                    👁 ${d.readNum} 阅读 · 👍 ${d.likedNum} 点赞
                </div>
            </div>`).join('');
    updateNewsBulkBar();
    syncFilterStatus('news');
}

// 复选框勾选/取消：只更新计数与卡片样式，不整列重绘（保持列表滚动位置）
function onNewsCheck(input, postId) {
    const key = String(postId);
    if (input.checked) newsSelectedIds.add(key); else newsSelectedIds.delete(key);
    input.closest('.person-card').classList.toggle('checked', input.checked);
    updateNewsBulkBar();
}

function updateNewsBulkBar() {
    document.getElementById('newsBulkCount').textContent = `☑ 已选 ${newsSelectedIds.size} 篇`;
    document.getElementById('newsDownloadBtn').disabled = newsSelectedIds.size === 0 || newsExportBusy;
}

// 全选当前搜索/筛选结果中的全部文章
function selectAllFilteredNews() {
    getFilteredNewsItems().forEach(({ d }) => newsSelectedIds.add(String(d.postId)));
    renderNewsList();
    if (getFilteredNewsItems().length === 0) showToast('当前没有匹配的文章', 'error');
}

function clearNewsSelection() {
    newsSelectedIds.clear();
    renderNewsList();
}

// 发贴统计聚合：按作者统计当前已加载文章的发贴数与首篇/最近一篇发布时间，从多到少排序
// 时间格式为 yyyy-MM-dd hh:mm:ss，可直接用字符串比较取最早/最晚
function aggregateNewsAuthorStats() {
    const byAuthor = new Map();
    newsData.forEach(d => {
        const name = (d.userName || '').trim() || '未知作者';
        const t = (d.createTime || '').slice(0, 16); // 精确到分钟
        let s = byAuthor.get(name);
        if (!s) {
            s = { name, count: 0, first: t, last: t };
            byAuthor.set(name, s);
        }
        s.count++;
        if (t) {
            if (!s.first || t < s.first) s.first = t;
            if (!s.last || t > s.last) s.last = t;
        }
    });
    return [...byAuthor.values()]
        .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'zh'));
}

function showNewsAuthorStats() {
    if (newsData.length === 0) {
        showToast('请先加载热点资讯', 'error');
        return;
    }
    const rows = aggregateNewsAuthorStats();

    selectedNewsIndex = -1; // 取消列表高亮，详情面板让位给统计表
    enterDetailView('newsWrap');
    renderNewsList();

    const pagedTip = newsData.length < newsTotalCount
        ? `<div class="stats-tip">⚠️ 当前为「每页100」分页模式，仅统计已加载的 ${newsData.length} 篇（服务端共 ${newsTotalCount} 篇）。切换到「全部」重新加载后统计可覆盖全部文章</div>`
        : '';
    const panel = document.getElementById('newsDetailPanel');
    panel.innerHTML = `
        <div class="stats-head">📊 发贴统计：共 ${rows.length} 位作者 / ${newsData.length} 篇文章（按发贴数从多到少）
            <button type="button" class="btn btn-primary btn-xs" style="margin-left:10px" onclick="exportNewsAuthorStats()">📥 导出Excel</button>
        </div>
        ${pagedTip}
        <table class="stats-table">
            <thead>
                <tr><th>#</th><th>作者</th><th>发贴数</th><th>第一篇发布时间</th><th>最近一篇发布时间</th></tr>
            </thead>
            <tbody>
                ${rows.map((r, i) => `
                <tr>
                    <td class="num">${i + 1}</td>
                    <td>${escapeHtml(r.name)}</td>
                    <td class="num">${r.count}</td>
                    <td class="time">${escapeHtml(r.first || '-')}</td>
                    <td class="time">${escapeHtml(r.last || '-')}</td>
                </tr>`).join('')}
            </tbody>
        </table>`;
}

// 导出发贴统计为 Excel（与页面表格同一份聚合数据）
function exportNewsAuthorStats() {
    if (newsData.length === 0) {
        showToast('请先加载热点资讯', 'error');
        return;
    }
    const rows = aggregateNewsAuthorStats().map((r, i) => ({
        '排名': i + 1,
        '作者': r.name,
        '发贴数': r.count,
        '第一篇发布时间': r.first || '-',
        '最近一篇发布时间': r.last || '-'
    }));
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    ws['!cols'] = [{ wch: 6 }, { wch: 16 }, { wch: 10 }, { wch: 20 }, { wch: 20 }];
    XLSX.utils.book_append_sheet(wb, ws, '发贴统计');
    const filename = `热点资讯发贴统计_${formatDate(new Date())}.xlsx`;
    XLSX.writeFile(wb, filename);
}

// 筛选条件（搜索关键词/只看置顶）变更：清空已选状态，保证与当前列表同步
function onNewsFilterChange() {
    if (newsSelectedIds.size > 0) newsSelectedIds.clear();
    renderNewsList();
}

// 点击文章：按需抓取详情（缓存），并自动获取已学习清单/标记已读，再渲染富文本内容
async function selectNews(index) {
    selectedNewsIndex = index;
    enterDetailView('newsWrap');
    renderNewsList();
    const d = newsData[index];
    if (!d) return;
    const panel = document.getElementById('newsDetailPanel');
    if (newsDetailCache[d.postId]) {
        renderNewsDetail(newsDetailCache[d.postId]);
        ensureLearnList(d.postId); // 已缓存详情时后台刷新清单，不阻塞渲染
        return;
    }
    panel.innerHTML = `<div class="empty-tip">⏳ 正在获取文章内容...</div>`;
    try {
        const detail = await fetchNewsDetail(d.postId);
        newsDetailCache[d.postId] = detail;
        if (selectedNewsIndex !== index) return; // 期间已切换
        renderNewsDetail(detail);
        ensureLearnList(d.postId); // 打开文章后自动执行：获取已学习清单 + 未读时标记已读
    } catch (e) {
        if (selectedNewsIndex !== index) return;
        panel.innerHTML = `<div class="empty-tip">❌ 获取文章内容失败：${escapeHtml(e.message)}<br><button class="btn btn-primary btn-xs" style="margin-top:10px" onclick="selectNews(${index})">🔄 重试</button></div>`;
    }
}

async function fetchNewsDetail(postId) {
    const buildUrl = () => `${FORUM_DETAIL_PATH}?postId=${postId}&token=${authToken}&companyId=${COMPANY_ID}`;
    let data = await apiGet(buildUrl());
    if (isAuthExpired(data)) {
        clearToken();
        await ensureLogin(true);
        data = await apiGet(buildUrl());
    }
    if (!data || data.resultCode !== 0 || !data.resultData) {
        throw new Error(data?.resultMessage || '未知错误');
    }
    return data.resultData;
}

function backToNewsList() {
    leaveDetailView('newsWrap');
}

// 渲染文章详情：大类>子类、标题、作者、发布时间、富文本正文（保留原始格式）、已学习名单占位
function renderNewsDetail(d) {
    const panel = document.getElementById('newsDetailPanel');
    const cat = [d.parentPlateName, d.plateName].filter(Boolean).join(' > ');
    const contentHtml = sanitizeArticleHtml(d.content || '');
    panel.innerHTML = `
        <button class="btn-back" onclick="backToNewsList()">← 返回列表</button>
        <div class="detail-header">
            ${cat ? `<div class="news-cat">${escapeHtml(cat)}</div>` : ''}

// ==================== 已学习清单 / 标记已读 ====================
// 打开文章后自动执行：获取已学习人员清单；若当前登录用户不在清单中，则调用接口标记为已读并刷新清单
async function ensureLearnList(postId) {
    try {
        let users = await fetchLearnList(postId);
        // 登录用户ID未知（旧缓存token未记录ID）时，通过 isCurrentPerson 兜底判断
        const selfKnown = currentUserId != null;
        const selfLearned = selfKnown
            ? users.some(u => Number(u.userId) === Number(currentUserId))
            : (newsDetailCache[postId]?.isCurrentPerson === 1);
        // 文章作者是登录用户本人时，不调用标记已读
        const isSelfAuthor = selfKnown && Number(newsDetailCache[postId]?.postUserId) === Number(currentUserId);
        if (!selfLearned && !isSelfAuthor) {
            const ok = await markArticleRead(postId);
            if (ok) {
                showToast('✅ 已标记本文档为已学习', 'success');
                users = await fetchLearnList(postId); // 标记成功后刷新清单
                // 阅读量数据变化：调用一次排名查询刷新状态栏徽章
                try { await fetchRanking(); } catch (e) { console.warn('刷新阅读量排名失败:', e); }
            }
        }
        renderLearnSection(postId, users);
    } catch (e) {
        console.warn('获取已学习清单失败:', e);
        renderLearnSection(postId, null, e.message);
    }
}

// 获取文章已学习人员清单（GET queryForumLearnUserRecord）
async function fetchLearnList(postId) {
    const buildUrl = () => `${FORUM_LEARN_LIST_PATH}?postId=${postId}&token=${authToken}&companyId=${COMPANY_ID}`;
    let data = await apiGet(buildUrl());
    if (isAuthExpired(data)) {
        clearToken();
        await ensureLogin(true);
        data = await apiGet(buildUrl());
    }
    if (!data || data.resultCode !== 0) {
        throw new Error(data?.resultMessage || '获取已学习清单失败');
    }
    return data.resultData || [];
}

// 设置文章阅读状态为已读（POST saveForumLearnDuration），返回是否成功
async function markArticleRead(postId) {
    const body = { postId: Number(postId), duration: 15, token: authToken, languageType: null, companyId: COMPANY_ID };
    let data = await apiRequest(FORUM_LEARN_SAVE_PATH, 'POST', body);
    if (isAuthExpired(data)) {
        clearToken();
        await ensureLogin(true);
        body.token = authToken;
        data = await apiRequest(FORUM_LEARN_SAVE_PATH, 'POST', body);
    }
    return !!(data && data.resultCode === 0);
}

// 渲染文章末尾「已学习」名单：username 逗号分隔 + 总人数
